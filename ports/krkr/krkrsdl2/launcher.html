<!doctype html>
<!--
  Launcher for the krkrsdl2 web build.

  The build's own `index.html` is generated by Emscripten and does two things we have to
  replace:

  1. **It writes the archive into the Emscripten filesystem over XHR.**
     `xhrDownloadFile(url, dest)` fetches the whole file and `FS.writeFile`s it. That is the
     reason the archive has to sit beside the page and the reason a multi-gigabyte XP3 cannot
     be opened at this build's 128 MB initial memory.

  2. **It validates `?data=` against `/^[0-9a-z._-]+$/i` and throws on anything else**, so a
     path — or a URL — is rejected during boot. The symptom is a stuck "Downloading..." and a
     404, which reads like an engine failure rather than a rejected parameter.

  This page keeps the parts that are genuinely the host's job — the canvas, the module
  configuration, IDBFS for saves, and the log surface — and hands the engine an archive
  **path** rather than bytes.

  Where the bytes come from is the next change, on the engine side: `tTVPLocalFileStream` in
  `src/core/base/sdl2/StorageImpl.cpp` is the single place the engine opens a file, so it is
  where a ranged read is attached. This page is the half that makes that possible, by no longer
  insisting the archive is already in the filesystem.

  The archive URL is taken from `?archive=`, and also accepts `?data=` so the two pages can be
  compared with the same URLs.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KiriKiri (krkrsdl2 web build)</title>
    <style>
      html, body { margin: 0; background: #111; color: #ddd; font: 13px/1.5 monospace; }
      /*
        The canvas is stretched to fill the viewport.

        The engine sets the canvas's own resolution from the window size — measured at
        2560x1398 with the generated page — so the element is given an explicit CSS size here
        and `object-fit: fill` covers the viewport. This mirrors the ONScripter harness, where
        letting the element and the drawing disagree produced an off-centre picture and a
        coordinate offset that took several rounds to untangle.
      */
      #viewport {
        position: relative;
        width: 100vw;
        height: 78vh;
        background: #000;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: fill;
      }
      #status { padding: 4px 8px; white-space: pre-wrap; color: #7ee787; }
      #log { padding: 4px 8px; white-space: pre-wrap; height: 20vh; overflow: auto; }
      .err { color: #ff7b72; }
      #spinner { display: none; }
    </style>
  </head>
  <body>
    <div id="viewport"><canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas></div>
    <div id="status"></div>
    <div id="log"></div>

    <script type="text/javascript">
      /*
        Query parameters.

        Parsed without the generated page's character allowlist: an archive URL legitimately
        contains `/`, `:` and `?`, and rejecting those is what made the stock page unusable for
        anything but a file copied next to it.
      */
      const params = new URLSearchParams(location.search);
      const archiveUrl = params.get('archive') ?? params.get('data') ?? 'data.xp3';
      /** Where the engine looks for its archive inside the Emscripten filesystem. */
      const archivePath = '/data.xp3';

      const statusElement = document.getElementById('status');
      const logElement = document.getElementById('log');
      const append = (text, className) => {
        const line = document.createElement('div');
        if (className) line.className = className;
        line.textContent = text;
        logElement.appendChild(line);
        // Capped, because an uncapped log grew to thousands of nodes in the ONScripter harness
        // and starved the main thread until every console request timed out.
        while (logElement.childElementCount > 300) logElement.removeChild(logElement.firstElementChild);
        logElement.scrollTop = logElement.scrollHeight;
      };

      append(`archive: ${archiveUrl}`);

      var Module = {
        // The engine is told where to find its archive; it is not handed the bytes.
        arguments: [archivePath],
        preRun: [],
        postRun: [],
        print: (text) => append(text),
        printErr: (text) => append(text, 'err'),
        setStatus: (text) => {
          statusElement.textContent = text || '';
        },
        canvas: (() => {
          const canvas = document.getElementById('canvas');
          // A lost WebGL context is worth surfacing rather than silently blanking the screen.
          canvas.addEventListener('webglcontextlost', (event) => {
            append('WebGL context lost', 'err');
            event.preventDefault();
          }, false);
          return canvas;
        })(),
        locateFile: (path) => path,
        onRuntimeInitialized: () => append('## runtime initialised'),
      };

      /*
        The archive URL is published on **`Module`**, not on `self`.

        `PROXY_TO_PTHREAD` runs the engine in a worker, where `self` is the `WorkerGlobalScope`. A
        global set on the page as `self.__krkrArchiveUrl` therefore does not exist on the thread the
        engine runs on, and the bridge reading it found nothing — which is why range requests stayed
        at zero while every symbol was present in the binary. `Module` is shared between the page and
        the worker, so the URL is published there.

        `self` is set as well, for the unthreaded case where both are the same object.
      */
      const archiveHref = new URL(archiveUrl, location.href).href;
      Module.__krkrArchiveUrl = archiveHref;
      self.__krkrArchiveUrl = archiveHref;
      append(`## ranged reads from ${archiveHref}`);

      /** Saves live in IDBFS, as the generated page arranged. */
      Module.preRun.push(() => {
        try {
          Module.FS.mkdir('/libsdl');
          Module.FS.mkdir('/libsdl/krkrsdl2');
          Module.FS.mount(Module.IDBFS, {}, '/libsdl/krkrsdl2');
          /*
            The restore is gated on a run dependency, exactly as the generated page does it.

            Without the dependency the `syncfs` restore runs concurrently with startup rather
            than before the engine looks for its files. The generated page's ordering is
            `mount` -> `syncfs` -> `removeRunDependency('savedata')` with the dependency added
            after, which is what holds the engine back until the save volume is restored.
          */
          Module.FS.syncfs(true, (error) => {
            if (error) append(`save sync failed: ${error}`, 'err');
            else append('## saves mounted (IDBFS)');
            Module.removeRunDependency('savedata');
          });
          Module.addRunDependency('savedata');
        } catch (error) {
          append(`could not mount IDBFS: ${error}`, 'err');
        }
      });

      // Reports why boot failed instead of leaving a stuck spinner: the stock page's throw on a
      // rejected `?data=` produced no visible error at all.
      window.addEventListener('unhandledrejection', (event) => {
        append(`unhandled rejection: ${event.reason}`, 'err');
      });
      window.addEventListener('error', (event) => {
        append(`error: ${event.message}`, 'err');
      });

      /*
        The module is instantiated explicitly.

        The build sets `MODULARIZE=1`, so `krkrsdl2.js` defines a global
        `instantiate_krkrsdl2_module` factory rather than starting itself — loading the script
        alone produces a described symptom: no error, a log with only this page's first line, and
        a canvas left at the `300x150` default. The generated page does the same thing, at its
        line 479.
      */
      const script = document.createElement('script');
      script.src = 'krkrsdl2.js';
      script.async = true;
      script.onload = () => {
        if (typeof instantiate_krkrsdl2_module !== 'function') {
          append('krkrsdl2.js did not define instantiate_krkrsdl2_module', 'err');
          return;
        }
        append('## loading wasm module');
        instantiate_krkrsdl2_module(Module);
      };
      script.onerror = () => append('could not load krkrsdl2.js', 'err');
      document.body.appendChild(script);
    </script>
  </body>
</html>
