schema: spec-driven

# 项目上下文：所有 agent 的统一入口（根目录 AGENTS.md 已移除，agent 协调统一走 OpenSpec）。
# 开工前先读本文件，再读 openspec/changes/ 下与任务相关的 change（proposal → design → specs → tasks）。
context: |
  项目：online_gal，浏览器端多引擎视觉小说（galgame）模拟器。把真实引擎编译成 WebAssembly 在浏览器里运行。
  许可 GPL-3.0-or-later，仓库 private，包均为 private、不发布 npm。部署在 Cloudflare Pages：https://onlinegal.de5.net/（自定义域名，2026-11-23 起；旧地址 onlinegal.cc.cd 只做 301 跳转到这里；Pages 默认地址为 onlinegal.pages.dev）
  当前范围：只维护 ONScripter（ONS）与 KiriKiri 两个引擎；Artemis、Siglus、Tyrano、web 代码保留但暂停适配，不要改动。
  主线 change：first-public-beta-ons-kirikiri（首个公开测试版）、redesign-frontend（前端重构）。
  其他进行中的 change：
  - plugin-system：插件系统（Service Worker 内核、插件包格式与来源证明、插件规则层）。其他 change 只能通过它的登记规则（design.md K19）扩展内核。
  - cf-account-admin：管理系统（Cloudflare 账号、/__cf 代理、浏览器版 cf、/admin），由单独的对话负责，在 plugin-system 里登记了 /__cf。
  - site-setup：站点初始化，两阶段构建。npm run build:pages（scripts/build-pages.mjs）检查 Pages 项目有没有 ONLINE_GAL_SITE：
    没有就只构建 apps/setup 的初始化页（不含插件系统、管理器、引擎）；所有者用 Cloudflare 登录，填写并校验初始化项
    （CLOUDFLARE_ACCOUNT_ID、CLOUDFLARE_API_TOKEN、GITHUB_TOKEN），写成生产环境的 Pages secret 并写入 ONLINE_GAL_SITE，再触发一次构建；
    有就调用 npm run build:site，产物不含任何初始化代码。不提供重置。服务器功能需要的密钥一律登记为初始化项
    （apps/setup/src/lib/setup-items.ts，见 site-setup design.md S7），不另做配置入口。属于管理系统，由 cf-account-admin 的对话负责。
    apps/app、functions/、站点构建里不得出现初始化代码。
  目录：
  - apps/app：前端，Astro 7 + Svelte 5（计划接入 Tailwind v4）。技术栈固定，不加其他框架、组件库或状态库。
  - packages/engine/core/onscripter-yuri、packages/engine/core/kirikiroid2-web：WASM 引擎。
  - packages/engine/interpreter/onscripter、packages/engine/interpreter/kirikiri-kag3：解释器回退。
  - packages/core、packages/engines、packages/vfs 等：平台包。ports/：上游移植与构建。docs/：文档。
  - packages/plugin-system（内核 sw.js、打包与建站脚本）、packages/plugin-host（插件规则层）：change plugin-system。
  - packages/cf-browser（浏览器版 cf）：change cf-account-admin。functions/：随站点部署的 Pages Functions，__ca 属于 plugin-system，__cf 属于 cf-account-admin。apps/setup、scripts/build-pages.mjs：change site-setup。
  命令（Git Bash，bash 语法；Node >= 22.12，pnpm 9.14.2）：npm run build:packages、npm run build、npm run check、
  npm run check:sources、npm test、npm run build:site（构建可部署的站点 dist/site，含插件系统；build 已包含 build:cf）、
  npm run build:pages（部署用：自动选择初始化构建或站点构建）、npm run build:setup（只构建初始化页）。
  前端单独：cd apps/app && npx astro check / npx astro build。
  硬约定：
  - 布局：产品代码只放 packages/、apps/、ports/ 并入库；测试、真实游戏、一次性脚本、截图放 .test/，参考检出与官方 SDK 放 .ref/（均 gitignored）。
    产品代码不得引用 .test/。任何 archive 解包前须断言落点在 .test/<dir>/、.ref/<dir>/ 或已校验的 ports/<port>/out/<dir>/ 下，绝不解到仓库根。
  - 提交：用显式 pathspec，不扫进他人 staged 改动；提交后及时 push，并在 GitHub 上看同一 commit 的 CI。
    docs/session-5697f1a7-handoff.md 与 ports/artemis/**/path-string.h 不 stage。
  - 证据：目录完整、构建成功、合成测试通过、真实游戏可用、再分发授权是五个不同结论。真实游戏测试是唯一判据，由用户亲自执行，
    单次不算（丢弃一次热身 + 两次一致）。不得把单测全绿当作引擎可用。
  - 许可：自有代码 GPL-3.0-or-later；官方 Artemis SDK 及其转译体是专有的，不得提交。发布二进制须提供对应源码。
  - 实测：同一时刻只跑一个引擎实例；结束时关掉自己开的浏览器窗口、服务器和后台进程。按 PID 结束进程，不得按进程名批量杀 node.exe。
  - 不改 docs/fetch-engine-artifacts.md 里的历史 hash。
  - Cloudflare 的命令行只用 `cf` CLI（v1.0.0-beta.5，已登录），不用 `wrangler`。查部署、读构建日志、上传站点都走 `cf pages`。
  - 进度与决定写回对应 change 的 tasks.md / design.md，不另建交接文档。
  团队（pi-teammate，频道 onlinegal，成员都在 D:\online_gal 下运行）：
  - leader：总负责与用户沟通的入口。把用户指令写成 openspec 里的目标与计划，汇总各成员状态向用户汇报，
    裁定范围与归属，整理需要用户决定的问题。只改 openspec/，不做具体实现和杂活。
  - admin-system：cf-account-admin 与 site-setup。plugin-system：plugin-system。
  - file-system：范围待用户确认。
  - small-task-operator：杂活与一次性操作（Cloudflare / GitHub 操作、部署、核对、跑命令），由 leader 派单。
  - redesign-frontend、first-public-beta-ons-kirikiri、establish-architecture-and-release-baseline 暂无专人，需要时由 leader 派给现有成员。
  - 实现者只勾选、备注自己 change 的 tasks.md；proposal/design/specs 的改动和新任务发给 leader 写。
  - 改别人范围的文件时把需求发给负责人，不自己改。范围以各 change 的归属一节为准（plugin-system K20、cf-account-admin A11）。
  - apps/app 的页面、组件、布局、样式归 redesign-frontend 的负责人（账号与 admin 文件除外）。first-public-beta 任务里的界面部分
    （2.4、4.2、5.1、6.2、6.3）在重写后的组件里实现；已知限制页只做一份。
    apps/app/astro.config.mjs 与 apps/app/src/lib/platform.ts 归 first-public-beta 的负责人。
  - 全仓构建和检查（npm run build、build:site、build:pages、check、test）会写共享产物：开始前在频道广播，结束后再广播，同一时刻只跑一个。
