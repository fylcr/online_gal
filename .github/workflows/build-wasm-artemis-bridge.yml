# Purpose: rebuild the official Artemis module on top of the hand-written engine in
# `ports/artemis/src` and gate the result. For intended inputs, secrets and outputs, see
# `.github/workflows/build-wasm-reusable.yml`.
# This workflow asserts the bytes of the rebuilt module and its agreement with the official module.
# It does not measure how much of the rewrite is in place, and its green run does not mean the module
# boots a game.
#
# LEGACY / MANUAL ONLY. This is the SDK route, not the shipping one: it runs wasm2c over the
# retained official asyncify module and recompiles the result, and that module's redistribution
# question is unresolved. The shipping Artemis build is the source build in
# `.github/workflows/build-wasm-artemis-compat.yml`.
#
# There are deliberately no `push:` and no `pull_request:` triggers below. They used to start a
# 30-minute wabt build and a 103 MB transpile on every change to `ports/artemis/src/**`,
# `ports/artemis/reverse/**` or the vendored SDK -- none of which this workflow can consume
# correctly, because `skip-upstream-checkout: true` means the rebuild's only link to a source
# revision is the `upstream_commit` input. As a result the content of the repository it checked out
# had no bearing on the bytes the four hash gates above accepted. So a push-triggered run could
# only report on an artifact that a hand dispatch had already made meaningful, and a pull-request
# run could not be a merge gate. Removing the triggers removes that pretense, not a gate: every
# assertion in this file still runs, and the workflow still fails closed, on a manual dispatch.
#
# Deleting this workflow, its build script and its pins record is NOT part of that change: the
# historical `expected` transpile hashes in `.github/upstream-pins.json` are frozen evidence, and
# the artifacts this route produced are still referenced by records that must stay reproducible.
name: Build wasm (Artemis bridge)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the built module as a GitHub Release'
        required: false
        type: boolean
        default: false
      # Kept with one option so a saved dispatch that still spells `sync` fails Actions validation
      # against a known input. No job reads this value; the build script refuses `sync` separately.
      flavour:
        description: 'Which official module to rebuild from (asyncify only; sync is retired)'
        required: false
        type: choice
        options: [asyncify]
        default: asyncify
      game_tree:
        description: 'Path to an extracted game tree for the real-game test (blank = skip it)'
        required: false
        type: string
        default: ''
      upstream_commit:
        description: 'Override the pinned upstream commit (blank = use .github/upstream-pins.json)'
        required: false
        type: string
        default: ''

concurrency:
  group: wasm-artemis-bridge-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ONE module is rebuilt here, and the SDK vendor tree ships exactly one build of it:
  # `ports/artemis/vendor/artemis-sdk/WebAssembly/asyncify/artemis.wasm`. The `sync` fork is retired
  # (its rewrite lives in an untracked `.ref/` tree), so this job does not read the `flavour` input
  # at all: the version, the release tag, the build script's `BRIDGE_FLAVOUR`, and the glue the
  # import-map gate compares against are all constants of this build now.
  bridge:
    uses: ./.github/workflows/build-wasm-reusable.yml
    with:
      engine: artemis-bridge
      build-script: .github/scripts/build-artemis-bridge.sh
      # The bridge's inputs are all in-repo, so there is no upstream checkout to fetch and the clone
      # step is skipped. `artemis-compat` is named only so the pins file and the drift check have one
      # place answering which upstream this artifact tracks.
      upstream-repository: https://github.com/Weiss-UltimateSavior/artemis-compat.git
      upstream-branch: main
      upstream-commit: ${{ inputs.upstream_commit || '9f622629f595db85e6f76c45c06edde29d7d9961' }}
      upstream-path: .ref/artemis-compat
      skip-upstream-checkout: true
      emsdk-version: '6.0.9'
      artifact-name: wasm-artemis-bridge
      artifact-dir: dist/artemis-bridge/build
      artifact-files: bridge.wasm
      # The release an operator expects, spelled as the asyncify runs always have.
      version: bridge-asyncify-9f62262
      release-tag: engine-artemis-bridge-asyncify-9f62262
      # States that this job builds the asyncify module; the input above is not forwarded here.
      build-env: BRIDGE_FLAVOUR=asyncify
      # The module derives from the proprietary SDK's binary, so publishing needs the same opt-in.
      publish: ${{ (inputs.publish || vars.ARTEMIS_PUBLISH_ARTIFACTS == 'true') && github.event_name != 'pull_request' }}
      # `--assets-from` copies THIS run's `bridge.wasm` into `<package>/assets/`. No code under
      # `src/` resolves that path or reads the file implicitly -- the caller hands the module to
      # `createArtemisBootTable` -- so the asset is a convenience for a consumer that wants these
      # bytes, and browser deploys still serve the module by URL. Having the bytes present is not a
      # claim that the packaged runtime boots a real game; that is the `real-game` job's question.
      package-dir: packages/runtime-artemis
      # At most one `package-dir` may set this true. Here the files only have to be present for a
      # caller that supplies the module.
      package-engine-assets: true
      # Makes the reusable workflow regenerate the glue import map from THIS run's `bridge.wasm` and
      # diff it against the committed table, so the claim is checked by the build that produced the
      # module. Unconditional, because there is one flavour.
      glue-import-map: ports/artemis/vendor/artemis-sdk/WebAssembly/asyncify/artemis.js

  # Separate from the gates above so a wrong render is distinguishable from a wrong ABI shape.
  real-game:
    needs: bridge
    if: inputs.game_tree != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Installed here rather than as a repo dependency because nothing else needs it.
      - name: Install the browser driver
        run: |
          set -eu
          npm install --no-save puppeteer

      - name: Download the built module
        uses: actions/download-artifact@v4
        with:
          name: wasm-artemis-bridge
          path: candidate

      - name: Run the real-game frame comparison
        run: |
          set -eu
          # The artifact keeps each file's path relative to the repository root, so resolve the
          # module rather than hard-coding the build script's output directory. This job is skipped
          # unless a game tree is supplied, so check this against a downloaded artifact when changing
          # it. The wait is pinned to the tool's own default so a change to that default cannot
          # silently shorten the frame budget.
          engine="$(find candidate -name bridge.wasm -print -quit)"
          test -n "$engine" || { echo "::error::bridge.wasm is missing from the artifact"; exit 1; }
          echo "## engine: $engine"
          node ports/artemis/tools/real-game-test.mjs \
            --game "${{ inputs.game_tree }}" \
            --engine "$engine" \
            --flavour asyncify \
            --hashlist \
            --wait 240000 \
            --json-out real-game-result.json
          cat real-game-result.json

      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artemis-bridge-real-game-result
          path: real-game-result.json
          if-no-files-found: warn
