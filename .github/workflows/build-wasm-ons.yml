# ONS web engine wasm. One engine per workflow so that a push touching ONS does not queue the
# KiriKiri or Artemis builds, and so a failure names the engine it belongs to.
#
# The `paths:` list is a cheap negative filter, not the authorization. An expensive native/WASM
# build and its GitHub Release share one condition: the exact `github.event.before..after` range
# contains a change to this package's release inputs. Those inputs are `src/**`, `scripts/**`,
# `package.json` and `tsconfig.json`. Lockfiles, sibling packages, ports, licenses, docs, committed
# assets and this workflow are deliberately absent: a push that touches only those starts nothing.
# GitHub can also decline to evaluate a paths filter above a file-count limit; the result is the
# same safe one, no build and no release. The job rechecks the exact range before any native step
# and fails closed when before is zero or either endpoint is missing.
#
# Upstream movement is not an input. `check-upstream-drift.yml` reports it and does not dispatch
# this workflow.
name: Build wasm (ONS)

on:
  push:
    branches: [main]
    paths:
      - 'packages/engine/core/onscripter-yuri/src/**'
      - 'packages/engine/core/onscripter-yuri/scripts/**'
      - 'packages/engine/core/onscripter-yuri/package.json'
      - 'packages/engine/core/onscripter-yuri/tsconfig.json'
      - 'packages/engine/interpreter/onscripter/src/**'
      - 'packages/engine/interpreter/onscripter/package.json'
      - 'packages/engine/interpreter/onscripter/tsconfig.json'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the built artifacts as a GitHub Release'
        required: true
        type: boolean
        default: false
      version:
        description: 'Full SemVer for this manual release, including +metadata. Required when publish is true.'
        required: false
        type: string
        default: ''
      upstream_commit:
        description: 'Override the pinned upstream commit (blank = use .github/upstream-pins.json)'
        required: false
        type: string
        default: ''

# One build per upstream commit, and a newer push cancels an older in-flight build of the same
# engine. Without `cancel-in-progress` a burst of pushes to a shared input queues three identical
# 20-minute builds; `group` keeps a rebuild from two different commits from cancelling each other.
concurrency:
  group: wasm-ons-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build-wasm-reusable.yml
    with:
      engine: ons
      build-script: .github/scripts/build-ons.sh
      upstream-repository: https://github.com/YuriSizuku/OnscripterYuri.git
      upstream-branch: master
      upstream-commit: ${{ inputs.upstream_commit || '08f744b31cc1907b66a15f0402e62321a131ed81' }}
      upstream-path: .ref/onscripter-yuri
      upstream-full-clone: false
      upstream-submodules: false
      emsdk-version: '6.0.9'
      artifact-name: wasm-ons
      artifact-dir: dist/ons
      artifact-files: onsyuri.wasm onsyuri.js onsyuri.html
      # Empty here. The preflight step writes the one full SemVer, and the reusable workflow reads
      # it from that step. There is no 0.7.7beta fallback: that string is historical provenance,
      # not this runtime's version.
      version: ''
      # Packaging is what makes the build output consumable. A consumer runs
      # `pnpm add https://github.com/fylcr/online_gal/releases/download/<tag>/online-gal-engine-core-onscripter-yuri-<version>.tgz`
      # and gets a runtime that needs no Emscripten SDK and no wasm build of its own. Each engine
      # sets its own `package-dir`, so packaging is opt-in per engine and an engine with none
      # still builds and publishes exactly as before. `krkr` and the Artemis bridge are wired the
      # same way; see `package-dir` in each of those workflows for what is specific to them.
      package-dir: packages/engine/core/onscripter-yuri
      # ONScripter is the one engine whose runtime reads its engine files out of the package:
      # `dist/wasm-runtime.js` resolves them as `new URL('../assets/', import.meta.url)` — that
      # file's parent directory is the package root, so they land in `<package>/assets/`. Without
      # them the tarball installs cleanly and then fails on the first frame. That makes the boolean
      # opt-IN rather than a default: krkr's engine is a URL-served page with no `assets/` at all,
      # and silently handing it this flag would ship a tarball full of megabytes no code path reads.
      package-engine-assets: true
      # Push authorization is the preflight exit status, not this expression. A manual run must
      # opt in with the boolean true; the default false and a pull request both stay off.
      publish: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true) }}
      immutable-release: true
      release-engine: ons
      manual-version: ${{ inputs.version }}
