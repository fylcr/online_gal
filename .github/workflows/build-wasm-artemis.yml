# Artemis web host wasm (the third-party `artemis-compat` port).
#
# ---------------------------------------------------------------------------------------------
# LICENSING: THIS IS THE ONE WORKFLOW WHOSE `publish` DEFAULT IS off, AND IT IS DELIBERATE
# ---------------------------------------------------------------------------------------------
#
# This engine links against `ports/artemis/vendor/artemis-sdk/`, the proprietary Artemis Engine SDK
# by Mikage. `THIRD_PARTY_NOTICES.md` records that as a known, accepted licence violation
# incompatible with this repository's GPL-3.0-or-later -- and the SDK's own `Copyright.txt` grants
# use only to parties who obtained permission from the author.
#
# Committing those binaries and *distributing a wasm built from them* are not the same act: the
# first is publication of an unmodified third-party file, the second ships a derived work as a
# product to anyone who can reach the release. So this workflow builds and tests by default, and
# publishing requires someone to say so each time -- either by ticking `publish_artifacts` on a
# manual run, or by setting the repository variable below. Nothing is hidden behind it: `publish`
# is a normal input, and the toggle is named so that its meaning is obvious in the run log.
#
# To publish anyway: Settings -> Secrets and variables -> Actions -> Variables, add
# `ARTEMIS_PUBLISH_ARTIFACTS = true`. To stop it again, delete the variable. The same switch is
# honoured by `check-upstream-drift.yml`, so the scheduled rebuild cannot publish behind your back.
#
# The Artemis **bridge** (the rewritten engine rebuilt from the official module's transpiled C) is a
# separate workflow, `build-wasm-artemis-bridge.yml`. It produces a different module from different
# sources; do not merge them.
name: Build wasm (Artemis host)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-wasm-artemis.yml'
      - '.github/workflows/build-wasm-reusable.yml'
      - '.github/scripts/build-artemis.sh'
      - '.github/scripts/make-manifest.mjs'
      - '.github/upstream-pins.json'
      - 'ports/env.sh'
      - 'ports/artemis/build/**'
      - 'ports/artemis/engine/**'
      - 'ports/artemis/vendor/**'
      # NOT 'ports/lib/engine-artifacts.json'. That file records what the publish step
      # produced -- it is an output of this pipeline, not an input to it. Listing it means
      # every hash update, which is a one-line edit, rebuilds every engine.
  pull_request:
    paths:
      - '.github/scripts/build-artemis.sh'
      - 'ports/artemis/build/**'
      - 'ports/artemis/engine/**'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the built artifacts as a GitHub Release (see the licensing note above)'
        required: false
        type: boolean
        default: false
      upstream_commit:
        description: 'Override the pinned upstream commit (blank = use .github/upstream-pins.json)'
        required: false
        type: string
        default: ''

concurrency:
  group: wasm-artemis-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build-wasm-reusable.yml
    with:
      engine: artemis
      build-script: .github/scripts/build-artemis.sh
      upstream-repository: https://github.com/Weiss-UltimateSavior/artemis-compat.git
      upstream-branch: main
      upstream-commit: ${{ inputs.upstream_commit || 'a4f8a257cf87cb8f65ab4e3f83501ab327a55424' }}
      upstream-path: .ref/artemis-compat
      upstream-full-clone: false
      emsdk-version: '6.0.9'
      artifact-name: wasm-artemis
      artifact-dir: dist/artemis
      artifact-files: artemis-web-android.wasm artemis-web-android.js
      version: web-android-a4f8a25
      # Pinned to the exact tag `ports/lib/engine-artifacts.json` downloads from. The reusable
      # workflow's default (`engine-<engine>-<version>`) would spell this `engine-artemis-web-android-a4f8a25`,
      # which no consumer would ever look for -- see the same note in build-wasm-krkr.yml.
      release-tag: engine-artemis-a4f8a25
      # `vars.ARTEMIS_PUBLISH_ARTIFACTS` is the standing consent; `inputs.publish` is the per-run
      # one. Both are required for a push-triggered run to publish, and neither is required for a
      # manual run that explicitly asks for it -- so deleting the variable is a complete off switch
      # for anything unattended.
      publish: ${{ (inputs.publish || vars.ARTEMIS_PUBLISH_ARTIFACTS == 'true') && github.event_name != 'pull_request' }}
