# KiriKiri2 web engine wasm. See build-wasm-ons.yml for why each engine gets its own workflow and
# why the trigger is an exact `paths:` list rather than `paths-ignore`.
#
# `paths` here is broader than ONS's because this engine's build is assembled from four places at
# once: upstream's own CMake preset, the vcpkg port overlays under `ports/krkr/kirikiroid2/`, the
# emsdk port-flag fix the build script applies, and `patch-vlfs-host-source.mjs` (which installs the
# host byte-source seam and imports `ports/lib/ref.mjs` to find the checkout). A push touching any of
# them changes the wasm.
name: Build wasm (KiriKiri2)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-wasm-krkr.yml'
      - '.github/workflows/build-wasm-reusable.yml'
      - '.github/scripts/build-krkr.sh'
      - '.github/scripts/make-manifest.mjs'
      - '.github/upstream-pins.json'
      - 'ports/env.sh'
      - 'ports/krkr/kirikiroid2/**'
      # NOT 'ports/lib/engine-artifacts.json'. That file records what the publish step
      # produced -- it is an output of this pipeline, not an input to it. Listing it means
      # every hash update, which is a one-line edit, rebuilds every engine.
      - 'ports/lib/ref.mjs'
      # The `package-dir` closure. `@online-gal/runtime-kag` is now packed into a published tarball
      # by this workflow, so an edit to the package or to any of the four dependencies it vendors
      # changes the released bytes. Judged by "is it inside the published artifact", not "does it get
      # compiled". Note the engine bytes are NOT in this package (see the `package-dir` comment
      # below), so `dist/krkr` edits still come from `ports/krkr/**` and this list is purely the
      # TypeScript half of the release. `pnpm-lock.yaml` is in the list for the same reason it is in
      # ONS's: the tarball's `dist/` is compiled by the TypeScript version the lockfile pins.
      - '.github/scripts/make-package.mjs'
      - 'packages/runtime-kag/**'
      - 'packages/engine-api/**'
      - 'packages/vfs/**'
      - 'packages/image-codec/**'
      - 'packages/player-host/**'
      - 'pnpm-lock.yaml'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
  pull_request:
    paths:
      - '.github/scripts/build-krkr.sh'
      - 'ports/krkr/kirikiroid2/**'
      - 'ports/lib/ref.mjs'
      - '.github/scripts/make-package.mjs'
      - 'packages/runtime-kag/**'
      - 'packages/engine-api/**'
      - 'packages/vfs/**'
      - 'packages/image-codec/**'
      - 'packages/player-host/**'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the built artifacts as a GitHub Release'
        required: false
        type: boolean
        default: true
      upstream_commit:
        description: 'Override the pinned upstream commit (blank = use .github/upstream-pins.json)'
        required: false
        type: string
        default: ''

concurrency:
  group: wasm-krkr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build-wasm-reusable.yml
    with:
      engine: krkr
      build-script: .github/scripts/build-krkr.sh
      upstream-repository: https://github.com/fenghengzhi/kirikiroid2-web.git
      upstream-branch: web
      upstream-commit: ${{ inputs.upstream_commit || '13dda190f8370d02b6cf59286a088529b355658c' }}
      upstream-path: .ref/kirikiroid2-web
      # The checkout has one submodule (`cpp/plugins/layerExImage`), and it is fetched after the
      # pinned commit is checked out so the submodule lands on the revision that commit records.
      upstream-submodules: true
      # vcpkg is set up by the reusable workflow at the commit the engine's
      # `vcpkg-configuration.json` names as its builtin-registry baseline. Pinning it here rather
      # than letting vcpkg resolve "the registry's default" is what makes the build reproducible.
      vcpkg-commit: b1e15efef6758eaa0beb0a8732cfa66f6a68a81d
      emsdk-version: '6.0.9'
      artifact-name: wasm-krkr
      artifact-dir: dist/krkr
      artifact-files: index.wasm index.js vlfs.js index.html shell.html assets.zip
      version: kirikiroid2-web-20260920
      # Stated explicitly instead of left to the reusable workflow's `engine-<engine>-<version>`
      # default. That default would spell this tag `engine-krkr-kirikiroid2-web-20260920`, which is
      # not the tag `ports/lib/engine-artifacts.json` tells the fetch helper to download from -- the
      # build would publish to one place and every consumer would look in another, and neither side
      # would report an error. The tag is a coincidence of naming, so it belongs in one visible place.
      release-tag: engine-krkr-20260920
      # `inputs.publish` is an empty string on `push` (no `inputs` context for that event), and GitHub
      # compares values of different types by coercing BOTH to a number -- `'' == false` -- so the
      # obvious `inputs.publish != false` is FALSE on a push and silently skips publishing. Name the
      # events instead, so nothing is left to a coercion rule.
      publish: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
      # The runtime package, packed from the same job that just built the engine.
      #
      # NO `--assets-from` here, and that is the point rather than an omission. KiriKiri's wasm is a
      # *served page*, not a file beside the module: `configureKirikiriWasm({ pageUrl })`
      # (`packages/runtime-kag/src/wasm-config.ts:55-58`) publishes where the build is served, and
      # `findKiriMount()` (`wasm-config.ts:75-89`) then hands the shell `?xp3=` or `?game=` to mount
      # the game archive. There is no `assets/` next to this package for the runtime to resolve,
      # because the engine is wherever the URL says. Handing `--assets-from dist/krkr` to this
      # package would copy `index.wasm index.js vlfs.js index.html shell.html assets.zip` in as
      # `assets/` -- megabytes of files that no code path in `@online-gal/runtime-kag` can find,
      # making the tarball look self-contained while being wrong about what it is.
      #
      # The engine bytes keep the route they already had: this run's `dist/krkr` artifact, and the
      # `engine-krkr-20260920` release that `ports/lib/fetch-engine.mjs krkr` fetches. The tarball is
      # the package half of the same build, not a replacement for the asset half.
      #
      # Its dependency closure is vendored inside the tarball, so any change to engine-api / vfs /
      # image-codec / player-host makes this published tarball stale and requires a version bump.
      package-dir: packages/runtime-kag
