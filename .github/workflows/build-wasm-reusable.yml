# Reusable wasm builder: the engine-agnostic half of every engine build.
#
# WHY THIS IS ONE FILE
#
# Three engines need the same six things: a full clone of an upstream checkout at a pinned commit,
# an Emscripten SDK at a pinned version, that SDK restored from cache on repeat runs, a build, a
# content-addressed manifest of what came out, and a publish step that puts those bytes somewhere a
# deploy can fetch them without compiling anything. Writing that six times would mean fixing every
# future bug six times, and the cache keys would drift apart, which is how one engine silently
# starts rebuilding from scratch on every push.
#
# So the shared logic lives here once and each engine supplies only what is genuinely its own: the
# checkout to fetch, the packages it needs, the script that builds it, and the files it produces.
# Engine-specific build logic lives in `.github/scripts/build-<engine>.sh` rather than inline,
# because a shell script can be run and debugged on a dev machine and a `run:` block cannot.
#
# WHAT THE CALLER CONTROLS, AND WHY IT IS INPUTS RATHER THAN DETECTION
#
#   * `upstream-commit` is passed in, not looked up. The pin in `.github/upstream-pins.json` is the
#     commit the published bytes were built from; a workflow that resolved "whatever the branch is
#     today" would produce a module no manifest describes, and the drift check would have nothing
#     to compare. Rebuilding deliberately on a newer upstream is a change to that file, which is
#     reviewable.
#   * `publish` is a first-class input because for one engine publishing is a licensing decision
#     rather than a technical one -- see build-wasm-artemis-bridge.yml.
#
# The manifest is generated by `.github/scripts/make-manifest.mjs`, the same file that produces the
# shape `ports/lib/engine-artifacts.json` uses, so the publishing half and the consuming half cannot
# disagree about what a manifest looks like.

name: Build engine wasm (reusable)

on:
  workflow_call:
    inputs:
      engine:
        description: 'Engine name: ons, krkr, artemis or artemis-bridge'
        required: true
        type: string
      build-script:
        description: 'Build script under .github/scripts/, e.g. .github/scripts/build-krkr.sh'
        required: true
        type: string
      upstream-repository:
        description: 'Upstream clone URL'
        required: true
        type: string
      upstream-branch:
        description: 'Upstream branch name, recorded in the manifest'
        required: true
        type: string
      upstream-commit:
        description: 'Exact upstream commit to check out (from .github/upstream-pins.json)'
        required: true
        type: string
      upstream-path:
        description: 'Where to put the checkout, relative to the repo root, e.g. .ref/onscripter-yuri'
        required: true
        type: string
      skip-upstream-checkout:
        description: 'Do not fetch an upstream checkout (for engines whose inputs are all in-repo)'
        required: false
        type: boolean
        default: false
      upstream-full-clone:
        description: 'Full clone instead of a shallow one (required by vcpkg)'
        required: false
        type: boolean
        default: false
      upstream-submodules:
        description: 'Recursively fetch submodules at the pinned commit'
        required: false
        type: boolean
        default: false
      emsdk-version:
        description: 'Emscripten SDK version'
        required: false
        type: string
        default: '6.0.9'
      system-deps:
        description: 'Extra apt packages, space separated'
        required: false
        type: string
        default: ''
      build-env:
        description: 'Extra KEY=VALUE pairs for the build script, newline separated'
        required: false
        type: string
        default: ''
      vcpkg-commit:
        description: 'vcpkg commit to set up via lukka/run-vcpkg (empty = no vcpkg)'
        required: false
        type: string
        default: ''
      artifact-name:
        description: 'Artifact name, e.g. wasm-krkr'
        required: true
        type: string
      artifact-dir:
        description: 'Directory containing the build outputs'
        required: true
        type: string
      artifact-files:
        description: 'Space-separated file names inside artifact-dir that are the publishable set'
        required: true
        type: string
      version:
        description: 'Version string recorded in the manifest and used in the release tag'
        required: true
        type: string
      publish:
        description: 'Create/update the GitHub Release with these bytes'
        required: false
        type: boolean
        default: true
      release-tag:
        description: 'Release tag; defaults to engine-<engine>-<version>'
        required: false
        type: string
        default: ''
      package-dir:
        description: 'Runtime package directory to pack into an npm tarball, e.g. packages/runtime-ons.
                      Space-separated for several. Empty = build the engine only, with no package.'
        required: false
        type: string
        default: ''
      package-engine-assets:
        description: 'Whether the tarball carries the engine files this run just built, as
                      package/assets/ (--assets-from inputs.artifact-dir). Only ONS works that way:
                      its runtime resolves new URL("../assets/", import.meta.url) — the parent
                      directory of the compiled dist/wasm-runtime.js is the package root, so they
                      land in <package>/assets/ — and a tarball without them imports fine and
                      fails on the first frame. The other runtimes mount
                      a URL-served page instead, so they carry no engine bytes and this stays false.
                      A true value with more than one package-dir is refused, because one
                      artifact-dir cannot honestly be the engine bytes for two different packages.'
        required: false
        type: boolean
        default: false
      glue-import-map:
        description: 'Path to the tracked glue (artemis.js) the committed import map in
                      ports/artemis/harness/glue/ was generated from, or empty to skip the
                      import-map gate. Only the bridge has one: the committed table is that
                      module''s import surface, byte for byte, so it can only be compared against
                      a build of the same module AND the same glue. A sync bridge is a different
                      module against a different glue, and the table says nothing about it — see
                      the gate step below.'
        required: false
        type: string
        default: ''
    outputs:
      manifest:
        description: 'The generated manifest JSON'
        value: ${{ jobs.build.outputs.manifest }}
      release-tag:
        description: 'The release tag the artifacts were published under'
        value: ${{ jobs.build.outputs.release-tag }}
      package-file:
        description: 'File name of the npm tarball (empty when package-dir is empty)'
        value: ${{ jobs.build.outputs.package-file }}
      package-files:
        description: 'Space-separated file names of every npm tarball this run produced, in the
                      order the packages were given. One name for a single package, so a caller that
                      only ever packages one engine does not have to change when a second appears.'
        value: ${{ jobs.build.outputs.package-files }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      EMSDK: ${{ github.workspace }}/.emsdk
      EMSDK_VERSION: ${{ inputs.emsdk-version }}
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
      # The directory `build-krkr.sh` points vcpkg's `files` binary-cache backend at. It is
      # a job-level env var because two separate steps have to agree on the path: the cache
      # step below saves it, and the build script writes into it.
      VCPKG_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-binary-cache
      ENGINE: ${{ inputs.engine }}
      UPSTREAM_PATH: ${{ inputs.upstream-path }}
    outputs:
      manifest: ${{ steps.manifest.outputs.json }}
      release-tag: ${{ steps.tag.outputs.tag }}
      package-file: ${{ steps.package.outputs.file }}
      package-files: ${{ steps.package.outputs.files }}
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      # The upstream checkout is fetched here rather than by the build script so that every engine
      # gets the same guarantee: the commit is the pinned one, and a fetch failure is a step failure
      # with a readable name instead of a confusing error inside a build log 40 minutes later.
      - name: Check out upstream at the pinned commit
        if: ${{ !inputs.skip-upstream-checkout }}
        run: |
          set -eu
          dest="$UPSTREAM_PATH"
          mkdir -p "$(dirname "$dest")"
          echo "## upstream: ${{ inputs.upstream-repository }} @ ${{ inputs.upstream-commit }}"
          if [ "${{ inputs.upstream-full-clone }}" = "true" ]; then
            git clone --branch "${{ inputs.upstream-branch }}" "${{ inputs.upstream-repository }}" "$dest"
          else
            git clone --depth 1 --branch "${{ inputs.upstream-branch }}" "${{ inputs.upstream-repository }}" "$dest"
          fi
          cd "$dest"
          git fetch --depth 1 origin "${{ inputs.upstream-commit }}"
          git checkout --detach "${{ inputs.upstream-commit }}"
          # Assert rather than assume: a checkout that silently landed elsewhere would build the
          # wrong engine and every downstream check would still pass, because they check the ABI
          # and not whose code that ABI is.
          actual="$(git rev-parse HEAD)"
          [ "$actual" = "${{ inputs.upstream-commit }}" ] || {
            echo "::error::checked out $actual, expected ${{ inputs.upstream-commit }}"
            exit 1
          }
          echo "## upstream HEAD: $actual"

      # Submodules are fetched here because they are recorded per-commit: checking out the pinned
      # commit first is what makes `submodule update` pick the pinned submodule revision rather
      # than the branch tip.
      - name: Fetch submodules
        if: inputs.upstream-submodules
        run: |
          set -eu
          cd "$UPSTREAM_PATH"
          git submodule update --init --recursive --depth 1

      - name: Install system dependencies
        run: |
          set -eu
          sudo apt-get update
          # `bison ninja-build python3 autoconf automake libtool` is the set the upstream
          # kirikiroid2-web workflow installs; kept here so every engine builds in the same image.
          sudo apt-get install -y bison ninja-build python3 autoconf automake libtool ${{ inputs.system-deps }}

      # Cached on the SDK version and the runner OS only: the cache entry is the whole emsdk tree,
      # which is independent of which engine is being built, so all engines share one entry.
      - name: Cache Emscripten SDK
        id: emsdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.EMSDK }}
          key: emsdk-${{ env.EMSDK_VERSION }}-${{ runner.os }}

      - name: Install Emscripten SDK
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          set -eu
          git clone https://github.com/emscripten-core/emsdk.git "$EMSDK"
          "$EMSDK/emsdk" install "$EMSDK_VERSION"
          "$EMSDK/emsdk" activate "$EMSDK_VERSION"

      # Publish EMSDK and the tool directories to later steps. `EM_CONFIG` is deliberately NOT set:
      # ports/env.sh documents why (two spellings of the same SDK path produce two different cache
      # sanity strings, and alternating between them wipes the sysroot and makes CMake report a
      # missing ZLIB). Emscripten finds `$EMSDK/.emscripten` on its own.
      - name: Activate Emscripten SDK
        run: |
          set -eu
          source "$EMSDK/emsdk_env.sh"
          echo "EMSDK=$EMSDK" >> "$GITHUB_ENV"
          EMSDK_NODE="$(find "$EMSDK/node" -name node -type f | head -1)"
          echo "EMSDK_NODE=$EMSDK_NODE" >> "$GITHUB_ENV"
          echo "$EMSDK" >> "$GITHUB_PATH"
          echo "$EMSDK/upstream/emscripten" >> "$GITHUB_PATH"
          echo "$(dirname "$EMSDK_NODE")" >> "$GITHUB_PATH"
          emcc --version | head -1

      # vcpkg's binary cache is the difference between a 12-second and a 38-minute configure: with no
      # cache at all, the manifest install rebuilds OpenCV, boost, bullet and 7zip from source for
      # `wasm32-emscripten` on every single run.
      #
      # `lukka/run-vcpkg` already points vcpkg at a binary cache -- it writes
      # `VCPKG_BINARY_SOURCES=clear;x-gha,readwrite` into `$GITHUB_ENV` -- but it is not storing
      # anything: `gh api repos/<owner>/<repo>/actions/caches` lists exactly one entry, the emsdk
      # tree saved above, and never a vcpkg archive. (Its `x-gha` backend needs
      # `ACTIONS_CACHE_URL` and `ACTIONS_RUNTIME_TOKEN`, which the Build step's env dump does not
      # list, but the empty listing is on its own enough to act on.) A `files` backend is an
      # ordinary directory that `actions/cache` can save and restore, and whose hit is visible in
      # that same listing. `build-krkr.sh` selects the `files` backend itself -- after this step, so
      # its value is the one vcpkg actually uses.
      #
      # The run that introduces this still pays full price: nothing is cached until it finishes, and
      # only the run after it benefits. That pair has since been measured on this repository: 38m01s
      # in configure with an empty directory, 117 archives left behind, and then -- same commit,
      # publishing off, nothing else changed -- 12s in configure with those 117 restored. All six
      # published files were identical by sha256 on both sides.
      #
      # The key names three things. The vcpkg commit pins the tooling, and the hash of the dependency
      # manifests is what makes adding one dependency cost one package instead of all of them. The
      # upstream commit is there because it is what `SOURCE_DATE_EPOCH` is derived from in
      # `build-krkr.sh`, and the archives this caches embed that timestamp: a moved pin has to start
      # from an empty directory rather than restore archives carrying the previous epoch. At a fixed
      # pin the component is a constant, so it does not change which archives come back.
      - name: Cache vcpkg binary artifacts
        if: inputs.vcpkg-commit != ''
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_BINARY_CACHE }}
          key: vcpkg-binary-${{ runner.os }}-${{ inputs.vcpkg-commit }}-${{ inputs.upstream-commit }}-${{ hashFiles('**/vcpkg.json', '**/vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-binary-${{ runner.os }}-${{ inputs.vcpkg-commit }}-${{ inputs.upstream-commit }}-

      - name: Set up vcpkg
        if: inputs.vcpkg-commit != ''
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ env.VCPKG_ROOT }}
          vcpkgGitCommitId: ${{ inputs.vcpkg-commit }}

      - name: Build
        env:
          # A build script that needs an engine-specific setting (the bridge's flavour, for
          # instance) gets it here rather than through a second input per setting.
          BUILD_ENV: ${{ inputs.build-env }}
        run: |
          set -eu
          export EMSDK_DIR="$EMSDK"
          export UPSTREAM_REPOSITORY="${{ inputs.upstream-repository }}"
          export UPSTREAM_BRANCH="${{ inputs.upstream-branch }}"
          export UPSTREAM_COMMIT="${{ inputs.upstream-commit }}"
          # Exported into THIS shell rather than appended to `$GITHUB_ENV`. A variable written to
          # `$GITHUB_ENV` only reaches *later steps*, so doing that here would leave the build script
          # below reading its own default -- and for the bridge that means a `sync` run would
          # transpile the asyncify module while its manifest said `sync`, with the in-script
          # per-flavour hash assertion passing because it defaults to asyncify too. Blank entries are
          # skipped so they cannot clobber a default the script computes for itself.
          if [ -n "$BUILD_ENV" ]; then
            while IFS= read -r setting; do
              [ -n "$setting" ] || continue
              export "$setting"
            done <<BUILD_ENV_EOF
          $BUILD_ENV
          BUILD_ENV_EOF
          fi
          bash "${{ inputs.build-script }}"

      # The import map in ports/artemis/harness/glue/ is a committed claim about one specific
      # module's import surface: every row's impl offset is an index into one specific glue file.
      # The claim is cheap to believe and expensive to be wrong about -- a module rebuilt with one
      # more or one fewer import makes all 405 offset checks fire at once and read like a corrupt
      # table, which is why nothing but a local gate used to stand behind it. This step is that
      # local gate, run in CI against the module THIS job just built: the table has to be
      # reproducible from this build's bytes, and an independent checker that re-decodes the import
      # section has to agree with the file on disk.
      #
      # Only the bridge sets `glue-import-map`. A `sync` build must leave it empty: that is a
      # different module against a different glue, and the committed table says nothing about it
      # (measured -- the generator refuses to emit for it at all, two rows without a citation).
      - name: Gate the committed import map against this build
        if: inputs.glue-import-map != ''
        env:
          GATE_BUILD_DIR: ${{ inputs.artifact-dir }}
          GATE_GLUE: ${{ inputs.glue-import-map }}
        run: |
          set -eu
          # --- identity first -------------------------------------------------
          #
          # A criterion that cannot say which bytes it judged is not a criterion. Both
          # digests go out before anything is compared, so a failure names the module and the
          # glue that produced it instead of asking a reader to go and work it out.
          WASM="$GATE_BUILD_DIR/bridge.wasm"
          ALIASES="$GATE_BUILD_DIR/runtime-imports.json"
          GLUE="$GATE_GLUE"
          MAP_JSON=ports/artemis/harness/glue/imports-map.json
          MAP_MD=ports/artemis/harness/glue/imports-map.md
          # `sha256sum x | cut -d' ' -f1` is not the way to say "absent": cut succeeds on empty
          # input, so a missing file yields a blank digest rather than a failure, and an identity
          # line with a blank in it is exactly the sort of thing a reader trusts. Test the file.
          digest() { if [ -s "$1" ]; then sha256sum "$1" | cut -d' ' -f1; else echo '(absent)'; fi; }
          echo "## gate: wasm   $WASM  $(digest "$WASM")"
          echo "## gate: glue   $GLUE  $(digest "$GLUE")"
          echo "## gate: map    $MAP_JSON"
          echo "## gate: map    $MAP_MD"

          # The generator is the criterion here, so it gets to be pedantic about its own
          # inputs: a missing file must fail the step, not be read as `undefined` and hashed.
          for f in "$WASM" "$ALIASES" "$GLUE" "$MAP_JSON" "$MAP_MD"; do
            [ -s "$f" ] || { echo "::error::the import-map gate needs $f and it is missing or empty"; exit 1; }
          done

          # --- 1. the table is what THIS build's ABI produces ------------------
          #
          # Regenerated into a scratch directory rather than over the committed files: a
          # regeneration that is correct must leave the working tree untouched, and one that is
          # wrong has to be able to print its own diff next to the committed one.
          #
          # No `--forward` here on purpose. The committed pair was generated without it, and
          # passing this build's imports-forward.c flips every row's `forwarded` from `-` to
          # `yes` -- a 200-line diff that is a difference in how the table was made, not in
          # what the module needs.
          OUT="$(mktemp -d)"
          echo "## gate: out    $OUT"
          node ports/artemis/harness/glue/imports-map.mjs \
            --wasm    "$WASM" \
            --glue    "$GLUE" \
            --aliases "$ALIASES" \
            --out-dir "$OUT"

          # The comparison is semantic, not textual, and the difference matters: a textual `diff`
          # has to be told what to ignore, so its whitelist is whatever someone remembered to
          # subtract -- and a checker whose contract lives in a `grep -v` pattern is one edit away
          # from ignoring something it should judge. `compare-imports-map.mjs` instead names the
          # fields it may mask, and everything else it does not name is compared exactly. That is
          # the same list the step needs and it is written where a reader can check it (the
          # comparer's header), so the two cannot drift apart silently.
          #
          # Masked, and only: `totals.moduleBytes` / `totals.moduleSha256` (the module embeds its
          # own build directory in the runtime's assert strings -- measured, the same tree gives
          # 41,321,914 B with `D:/online_gal/...` from a Windows checkout and 41,322,022 B with
          # `/home/runner/work/...` from this runner, so a criterion that included them could only
          # ever be met by the machine that wrote the committed pair, which is not a gate but a
          # coincidence with a comment); each row's `typeIndex`; and a `type#N` ordinal token
          # inside a row's `duplicate` string, because the ordinal counts duplicates of the same
          # type within one build and renumbers when an unrelated import is added. In the markdown,
          # the VALUE cell only of the two `module bytes` / `module sha256` rows -- label cells,
          # cell spacing and the trailing cell are compared verbatim, so a lost space there is a
          # difference and not a masked one.
          #
          # Judged strictly, because none of it can move because a build happened elsewhere: row
          # order, every function name and signature, every bucket, every glue offset, every alias,
          # the non-function imports with their limits, and the glue's own sha256. Nothing is
          # whitelisted by substring, so a field nobody thought about is compared rather than
          # waived.
          #
          # `--wasm` makes this two checks in one: the comparer decodes the import section with the
          # sibling verifier's reader -- deliberately not the generator's, so this is a second
          # opinion and not the generator marking its own work -- and judges the regenerated table
          # against that decode. It exits 2 on bad usage and 1 on any mismatch, so both are read as
          # a failed step.
          #
          # The exit status is read directly rather than through a pipe: a `node ... | tail`
          # pipeline returns tail's status, and a comparison that failed every row would then pass.
          echo "## gate: table was made from module $(grep -oE '"moduleSha256": *"[0-9a-f]{8}' "$MAP_JSON" | head -1 | grep -oE '[0-9a-f]{8}$')"
          echo "## gate: this run built module       $(digest "$WASM" | cut -c1-8)"
          if ! node ports/artemis/harness/glue/compare-imports-map.mjs \
                --committed    "$MAP_JSON" \
                --regenerated  "$OUT/imports-map.json" \
                --committed-md "$MAP_MD" \
                --regenerated-md "$OUT/imports-map.md" \
                --wasm         "$WASM" > "$OUT/compare.txt" 2>&1; then
            tail -40 "$OUT/compare.txt"
            echo "::error::the committed table in $MAP_JSON / $MAP_MD no longer describes what $GLUE ($(sha256sum "$GLUE" | cut -d' ' -f1)) and $WASM ($(sha256sum "$WASM" | cut -d' ' -f1)) produce. The comparer judges the ABI and masks only the module's own two provenance lines, each row's typeIndex and a type#N ordinal; regenerate the table for these inputs (ports/artemis/harness/glue/README.md) and commit both files."
            exit 1
          fi
          tail -1 "$OUT/compare.txt"
          echo "## gate: the committed table is ABI-identical to a regeneration from this build"

          # --- 2. the independent checker agrees ------------------------------
          #
          # Its exit status is the verdict and is read directly rather than through a pipe: a
          # `node ... | tail` pipeline returns tail's status, and a table that failed every
          # offset check would then pass. The checker re-decodes the import section with its own
          # reader, so this is a second opinion and not the generator marking its own work.
          #
          # It is pointed at the REGENERATED pair in $OUT, not at the committed files. The
          # committed pair was already judged in step 1, and judging it twice would make this
          # step's evidence rest on the same two files: a table that is wrong the same way in
          # both places would be confirmed rather than caught. Against $OUT the chain is closed
          # end to end on this build's own bytes -- the generator emits a pair, the comparer
          # says it is the committed ABI, and this checker re-derives that SAME pair from the
          # module with an independently written decoder and the glue's own offsets. The gate
          # then means: this build reproduces a table that is both the committed one and
          # self-consistent with its bytes.
          #
          # $OUT is the one from step 1 and is deliberately reused rather than re-created -- a
          # second mktemp would leave the first directory behind, and re-creating it would
          # discard the very files the comparer just validated.
          if ! node ports/artemis/harness/glue/verify-imports-map.mjs \
                --wasm "$WASM" \
                --glue "$GLUE" \
                --json "$OUT/imports-map.json" \
                --md   "$OUT/imports-map.md" > "$OUT/verify.txt" 2>&1; then
            tail -40 "$OUT/verify.txt"
            echo "::error::verify-imports-map.mjs failed on this build's module and the table regenerated from it (the committed pair was ABI-identical in step 1, so this is the independent decoder disagreeing with the generator's output)"
            exit 1
          fi
          tail -1 "$OUT/verify.txt"
          echo "## gate: the independent checker passes on the regenerated table"
          # Before the narrow delete below: the path has to be the scratch directory mktemp
          # actually made, resolved, and it has to be a directory. `rm -rf` on a variable that
          # turned out empty, or on a path that somehow resolved to the checkout, would take
          # the working tree with it -- and an empty $OUT is not a hypothetical, since a
          # `mktemp -d` that failed would have left the generator above writing nowhere.
          OUT_ABS="$(cd "$OUT" && pwd)"
          case "$OUT_ABS" in
            /tmp/tmp.*|/var/folders/*|"$RUNNER_TEMP"/tmp.*) ;;
            *) echo "::error::refusing to remove $OUT_ABS -- it is not a mktemp directory under the runner's temp root"; exit 1 ;;
          esac
          [ -d "$OUT_ABS" ] || { echo "::error::the scratch directory $OUT_ABS is not a directory"; exit 1; }
          echo "## gate: removing scratch $OUT_ABS"
          rm -rf "$OUT_ABS"

      # Resolved before the manifest because the manifest records the tag its download URLs are
      # built from -- the fetch side turns `repository` + `releaseTag` + name into a URL, so the two
      # have to be written together or a consumer is told to look somewhere the bytes are not.
      - name: Resolve release tag
        id: tag
        run: |
          set -eu
          tag="${{ inputs.release-tag }}"
          if [ -z "$tag" ]; then
            tag="engine-${{ inputs.engine }}-${{ inputs.version }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "## release tag: $tag"

      # The manifest is generated from the bytes on disk, never from the build log, and it fails the
      # run when a promised file is missing or empty: publishing a manifest that describes a file
      # nobody can download would turn into a confusing engine bug on someone else's machine.
      - name: Generate manifest
        id: manifest
        run: |
          set -eu
          files=""
          for name in ${{ inputs.artifact-files }}; do
            files="$files --file $name"
          done
          node .github/scripts/make-manifest.mjs \
            --engine "${{ inputs.engine }}" \
            --version "${{ inputs.version }}" \
            --upstream "${{ inputs.upstream-repository }} @ ${{ inputs.upstream-commit }}" \
            --emsdk "$EMSDK_VERSION" \
            --repository "${{ github.server_url }}/${{ github.repository }}" \
            --release-tag "${{ steps.tag.outputs.tag }}" \
            --dir "${{ inputs.artifact-dir }}" \
            $files \
            --out manifest.json
          echo "json<<EOF" >> "$GITHUB_OUTPUT"
          cat manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      # An Actions artifact for in-run and same-repo consumers (downloaded with the run's token),
      # and a Release asset for everyone else. Both carry the same bytes; the manifest is uploaded
      # beside them so a consumer can verify what it fetched.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: |
            ${{ inputs.artifact-dir }}/*
            manifest.json
          if-no-files-found: error
          retention-days: 90

      # The package is the point of the pipeline: a consumer installs this and never compiles a
      # wasm. The raw files above stay published unchanged, because `ports/lib/fetch-engine.mjs`
      # downloads them by name and does not know about packages -- replacing that interface would
      # break every port and the hash manifest for no gain.
      #
      # Three things have to be true for the tarball to be installable at all, and each of them is
      # a thing that is easy to lose in a later edit:
      #
      #   1. the packages must be BUILT, not just checked out -- `make-package.mjs` refuses a
      #      `dist/` that does not exist, because a tarball with an empty `dist` installs and then
      #      fails on the consumer's first import, which is the worst shape a failure can take.
      #   2. pnpm must be installed first, for the dependency vendoring.
      #   3. the engine bytes that just got built are fed in with `--assets-from`, so the package
      #      carries THIS run's wasm rather than the committed one. The whole reason to package a
      #      build is to ship the build.
      - name: Install pnpm
        if: inputs.package-dir != ''
        run: |
          set -eu
          # `corepack enable` then a bare `pnpm` is the modern form; `corepack prepare` is deprecated
          # and is not what pins the version. What pins it is `packageManager` in the repository's
          # own package.json, which corepack reads -- so the version is never written twice.
          corepack enable
          pnpm --version

      - name: Install workspace dependencies
        if: inputs.package-dir != ''
        run: |
          set -eu
          pnpm install --frozen-lockfile

      - name: Build the packages
        if: inputs.package-dir != ''
        run: |
          set -eu
          pnpm run build:packages

      - name: Pack the runtime package
        id: package
        if: inputs.package-dir != ''
        run: |
          set -eu
          # `package-dir` is space-separated so one job can ship both a per-engine package and a
          # cross-engine one, and each becomes its own tarball: `online-gal-<name>-<version>.tgz` is
          # derived from the manifest, so two packages never collide in `dist/packages` and the
          # "upload every *.tgz" steps below stay correct without knowing how many there are.
          #
          # `--quiet` makes the script print the absolute tarball path and nothing else, so this
          # step does not have to guess the file name with `ls` -- which would silently pick the
          # wrong file the day a second .tgz ever lands in the output directory.
          files=''
          count=0
          for dir in ${{ inputs.package-dir }}; do
            if [ "${{ inputs.package-engine-assets }}" = 'true' ]; then
              assets=(--assets-from "${{ inputs.artifact-dir }}")
            else
              # Deliberately NOT passing --assets-from for the runtimes whose engine is a
              # URL-served page rather than a file beside the module. Pointing --assets-from at this
              # job's artifact-dir would copy `index.wasm index.js vlfs.js ...` into the package as
              # `assets/`, which nothing in those packages ever reads -- a tarball that looks
              # complete and is carrying four megabytes of files no code path can find.
              assets=()
            fi
            file="$(node .github/scripts/make-package.mjs \
              --package "$dir" \
              "${assets[@]}" \
              --out dist/packages \
              --quiet)"
            echo "## package: $file"
            name="$(basename "$file")"
            if [ "$count" -eq 0 ]; then
              # `package-file` is the name of the FIRST package, kept as its own output so a caller
              # that packages exactly one engine keeps working untouched. New callers should read
              # `package-files` and not assume a single name.
              echo "file=$name" >> "$GITHUB_OUTPUT"
            fi
            files="${files:+$files }$name"
            count=$((count + 1))
          done
          test "$count" -gt 0 || { echo "::error::package-dir is set but no package was packed"; exit 1; }
          echo "files=$files" >> "$GITHUB_OUTPUT"

      # Uploaded as its own artifact so a run can be consumed without waiting for a release, and so
      # the tarball and the loose files can be verified against each other in one download.
      - name: Upload package
        if: inputs.package-dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}-package
          path: dist/packages/*.tgz
          if-no-files-found: error
          retention-days: 90

      - name: Publish release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag='${{ steps.tag.outputs.tag }}'
          # `gh release create` fails when the tag exists, which is the normal case for a rebuild of
          # the same version -- so treat "already exists" as success and clobber the assets below.
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" \
              --title "wasm: ${{ inputs.engine }} ${{ inputs.version }}" \
              --notes "Built from ${{ inputs.upstream-repository }} @ ${{ inputs.upstream-commit }} with Emscripten $EMSDK_VERSION on run [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})." \
              --target "${{ github.sha }}"
          uploaded=0
          for name in ${{ inputs.artifact-files }}; do
            gh release upload "$tag" "${{ inputs.artifact-dir }}/$name" --clobber
            uploaded=$((uploaded + 1))
          done
          gh release upload "$tag" manifest.json --clobber
          echo "## published $uploaded file(s) + manifest.json to $tag"
          # The tarball is an ADDITIONAL asset, not a replacement: `fetch-engine.mjs` still fetches
          # the loose files by name and must keep working. Uploaded last so a failure here cannot
          # cost the loose assets above.
          if [ -n "${{ inputs.package-dir }}" ]; then
            for tgz in dist/packages/*.tgz; do
              gh release upload "$tag" "$tgz" --clobber
              echo "## published $(basename "$tgz") to $tag"
            done
          fi
