# Reusable wasm builder: the engine-agnostic half of every engine build.
#
# WHY THIS IS ONE FILE
#
# Three engines need the same six things: a full clone of an upstream checkout at a pinned commit,
# an Emscripten SDK at a pinned version, that SDK restored from cache on repeat runs, a build, a
# content-addressed manifest of what came out, and a publish step that puts those bytes somewhere a
# deploy can fetch them without compiling anything. Writing that six times would mean fixing every
# future bug six times, and the cache keys would drift apart, which is how one engine silently
# starts rebuilding from scratch on every push.
#
# So the shared logic lives here once and each engine supplies only what is genuinely its own: the
# checkout to fetch, the packages it needs, the script that builds it, and the files it produces.
# Engine-specific build logic lives in `.github/scripts/build-<engine>.sh` rather than inline,
# because a shell script can be run and debugged on a dev machine and a `run:` block cannot.
#
# WHAT THE CALLER CONTROLS, AND WHY IT IS INPUTS RATHER THAN DETECTION
#
#   * `upstream-commit` is passed in, not looked up. The pin in `.github/upstream-pins.json` is the
#     commit the published bytes were built from; a workflow that resolved "whatever the branch is
#     today" would produce a module no manifest describes, and the drift check would have nothing
#     to compare. Rebuilding deliberately on a newer upstream is a change to that file, which is
#     reviewable.
#   * `publish` is a first-class input because for one engine publishing is a licensing decision
#     rather than a technical one -- see build-wasm-artemis.yml.
#
# The manifest is generated by `.github/scripts/make-manifest.mjs`, the same file that produces the
# shape `ports/lib/engine-artifacts.json` uses, so the publishing half and the consuming half cannot
# disagree about what a manifest looks like.

name: Build engine wasm (reusable)

on:
  workflow_call:
    inputs:
      engine:
        description: 'Engine name: ons, krkr, artemis or artemis-bridge'
        required: true
        type: string
      build-script:
        description: 'Build script under .github/scripts/, e.g. .github/scripts/build-krkr.sh'
        required: true
        type: string
      upstream-repository:
        description: 'Upstream clone URL'
        required: true
        type: string
      upstream-branch:
        description: 'Upstream branch name, recorded in the manifest'
        required: true
        type: string
      upstream-commit:
        description: 'Exact upstream commit to check out (from .github/upstream-pins.json)'
        required: true
        type: string
      upstream-path:
        description: 'Where to put the checkout, relative to the repo root, e.g. .ref/onscripter-yuri'
        required: true
        type: string
      skip-upstream-checkout:
        description: 'Do not fetch an upstream checkout (for engines whose inputs are all in-repo)'
        required: false
        type: boolean
        default: false
      upstream-full-clone:
        description: 'Full clone instead of a shallow one (required by vcpkg)'
        required: false
        type: boolean
        default: false
      upstream-submodules:
        description: 'Recursively fetch submodules at the pinned commit'
        required: false
        type: boolean
        default: false
      emsdk-version:
        description: 'Emscripten SDK version'
        required: false
        type: string
        default: '6.0.9'
      system-deps:
        description: 'Extra apt packages, space separated'
        required: false
        type: string
        default: ''
      build-env:
        description: 'Extra KEY=VALUE pairs for the build script, newline separated'
        required: false
        type: string
        default: ''
      vcpkg-commit:
        description: 'vcpkg commit to set up via lukka/run-vcpkg (empty = no vcpkg)'
        required: false
        type: string
        default: ''
      artifact-name:
        description: 'Artifact name, e.g. wasm-krkr'
        required: true
        type: string
      artifact-dir:
        description: 'Directory containing the build outputs'
        required: true
        type: string
      artifact-files:
        description: 'Space-separated file names inside artifact-dir that are the publishable set'
        required: true
        type: string
      version:
        description: 'Version string recorded in the manifest and used in the release tag'
        required: true
        type: string
      publish:
        description: 'Create/update the GitHub Release with these bytes'
        required: false
        type: boolean
        default: true
      release-tag:
        description: 'Release tag; defaults to engine-<engine>-<version>'
        required: false
        type: string
        default: ''
    outputs:
      manifest:
        description: 'The generated manifest JSON'
        value: ${{ jobs.build.outputs.manifest }}
      release-tag:
        description: 'The release tag the artifacts were published under'
        value: ${{ jobs.build.outputs.release-tag }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      EMSDK: ${{ github.workspace }}/.emsdk
      EMSDK_VERSION: ${{ inputs.emsdk-version }}
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
      # The directory `build-krkr.sh` points vcpkg's `files` binary-cache backend at. It is
      # a job-level env var because two separate steps have to agree on the path: the cache
      # step below saves it, and the build script writes into it.
      VCPKG_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-binary-cache
      ENGINE: ${{ inputs.engine }}
      UPSTREAM_PATH: ${{ inputs.upstream-path }}
    outputs:
      manifest: ${{ steps.manifest.outputs.json }}
      release-tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      # The upstream checkout is fetched here rather than by the build script so that every engine
      # gets the same guarantee: the commit is the pinned one, and a fetch failure is a step failure
      # with a readable name instead of a confusing error inside a build log 40 minutes later.
      - name: Check out upstream at the pinned commit
        if: ${{ !inputs.skip-upstream-checkout }}
        run: |
          set -eu
          dest="$UPSTREAM_PATH"
          mkdir -p "$(dirname "$dest")"
          echo "## upstream: ${{ inputs.upstream-repository }} @ ${{ inputs.upstream-commit }}"
          if [ "${{ inputs.upstream-full-clone }}" = "true" ]; then
            git clone --branch "${{ inputs.upstream-branch }}" "${{ inputs.upstream-repository }}" "$dest"
          else
            git clone --depth 1 --branch "${{ inputs.upstream-branch }}" "${{ inputs.upstream-repository }}" "$dest"
          fi
          cd "$dest"
          git fetch --depth 1 origin "${{ inputs.upstream-commit }}"
          git checkout --detach "${{ inputs.upstream-commit }}"
          # Assert rather than assume: a checkout that silently landed elsewhere would build the
          # wrong engine and every downstream check would still pass, because they check the ABI
          # and not whose code that ABI is.
          actual="$(git rev-parse HEAD)"
          [ "$actual" = "${{ inputs.upstream-commit }}" ] || {
            echo "::error::checked out $actual, expected ${{ inputs.upstream-commit }}"
            exit 1
          }
          echo "## upstream HEAD: $actual"

      # Submodules are fetched here because they are recorded per-commit: checking out the pinned
      # commit first is what makes `submodule update` pick the pinned submodule revision rather
      # than the branch tip.
      - name: Fetch submodules
        if: inputs.upstream-submodules
        run: |
          set -eu
          cd "$UPSTREAM_PATH"
          git submodule update --init --recursive --depth 1

      - name: Install system dependencies
        run: |
          set -eu
          sudo apt-get update
          # `bison ninja-build python3 autoconf automake libtool` is the set the upstream
          # kirikiroid2-web workflow installs; kept here so every engine builds in the same image.
          sudo apt-get install -y bison ninja-build python3 autoconf automake libtool ${{ inputs.system-deps }}

      # Cached on the SDK version and the runner OS only: the cache entry is the whole emsdk tree,
      # which is independent of which engine is being built, so all engines share one entry.
      - name: Cache Emscripten SDK
        id: emsdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.EMSDK }}
          key: emsdk-${{ env.EMSDK_VERSION }}-${{ runner.os }}

      - name: Install Emscripten SDK
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          set -eu
          git clone https://github.com/emscripten-core/emsdk.git "$EMSDK"
          "$EMSDK/emsdk" install "$EMSDK_VERSION"
          "$EMSDK/emsdk" activate "$EMSDK_VERSION"

      # Publish EMSDK and the tool directories to later steps. `EM_CONFIG` is deliberately NOT set:
      # ports/env.sh documents why (two spellings of the same SDK path produce two different cache
      # sanity strings, and alternating between them wipes the sysroot and makes CMake report a
      # missing ZLIB). Emscripten finds `$EMSDK/.emscripten` on its own.
      - name: Activate Emscripten SDK
        run: |
          set -eu
          source "$EMSDK/emsdk_env.sh"
          echo "EMSDK=$EMSDK" >> "$GITHUB_ENV"
          EMSDK_NODE="$(find "$EMSDK/node" -name node -type f | head -1)"
          echo "EMSDK_NODE=$EMSDK_NODE" >> "$GITHUB_ENV"
          echo "$EMSDK" >> "$GITHUB_PATH"
          echo "$EMSDK/upstream/emscripten" >> "$GITHUB_PATH"
          echo "$(dirname "$EMSDK_NODE")" >> "$GITHUB_PATH"
          emcc --version | head -1

      # vcpkg's binary cache is the difference between a ~5-minute and a ~50-minute configure: with
      # no cache at all, the manifest install rebuilds OpenCV, boost, bullet and 7zip from source for
      # `wasm32-emscripten` on every single run.
      #
      # `lukka/run-vcpkg` already points vcpkg at a binary cache -- it writes
      # `VCPKG_BINARY_SOURCES=clear;x-gha,readwrite` into `$GITHUB_ENV` -- but it is not storing
      # anything: `gh api repos/<owner>/<repo>/actions/caches` lists exactly one entry, the emsdk
      # tree saved above, and never a vcpkg archive. (Its `x-gha` backend needs
      # `ACTIONS_CACHE_URL` and `ACTIONS_RUNTIME_TOKEN`, which the Build step's env dump does not
      # list, but the empty listing is on its own enough to act on.) A `files` backend is an
      # ordinary directory that `actions/cache` can save and restore, and whose hit is visible in
      # that same listing. `build-krkr.sh` selects the `files` backend itself -- after this step, so
      # its value is the one vcpkg actually uses.
      #
      # The run that introduces this still pays full price: nothing is cached until it finishes, and
      # only the run after it benefits. Expect the configure stage to fall from ~50 minutes to a
      # download, and read the `Restored N package(s)` line the build script now prints to confirm
      # the cache is why.
      #
      # The key is the vcpkg commit plus the hash of the dependency manifests; `restore-keys` keeps
      # the newest entry for the same vcpkg commit reachable when a manifest changes, which is what
      # makes adding one dependency cost one package instead of all of them.
      - name: Cache vcpkg binary artifacts
        if: inputs.vcpkg-commit != ''
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_BINARY_CACHE }}
          key: vcpkg-binary-${{ runner.os }}-${{ inputs.vcpkg-commit }}-${{ hashFiles('**/vcpkg.json', '**/vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-binary-${{ runner.os }}-${{ inputs.vcpkg-commit }}-

      - name: Set up vcpkg
        if: inputs.vcpkg-commit != ''
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ env.VCPKG_ROOT }}
          vcpkgGitCommitId: ${{ inputs.vcpkg-commit }}

      - name: Build
        env:
          # A build script that needs an engine-specific setting (the bridge's flavour, for
          # instance) gets it here rather than through a second input per setting.
          BUILD_ENV: ${{ inputs.build-env }}
        run: |
          set -eu
          export EMSDK_DIR="$EMSDK"
          export UPSTREAM_REPOSITORY="${{ inputs.upstream-repository }}"
          export UPSTREAM_BRANCH="${{ inputs.upstream-branch }}"
          export UPSTREAM_COMMIT="${{ inputs.upstream-commit }}"
          # Exported into THIS shell rather than appended to `$GITHUB_ENV`. A variable written to
          # `$GITHUB_ENV` only reaches *later steps*, so doing that here would leave the build script
          # below reading its own default -- and for the bridge that means a `sync` run would
          # transpile the asyncify module while its manifest said `sync`, with the in-script
          # per-flavour hash assertion passing because it defaults to asyncify too. Blank entries are
          # skipped so they cannot clobber a default the script computes for itself.
          if [ -n "$BUILD_ENV" ]; then
            while IFS= read -r setting; do
              [ -n "$setting" ] || continue
              export "$setting"
            done <<BUILD_ENV_EOF
          $BUILD_ENV
          BUILD_ENV_EOF
          fi
          bash "${{ inputs.build-script }}"

      # Resolved before the manifest because the manifest records the tag its download URLs are
      # built from -- the fetch side turns `repository` + `releaseTag` + name into a URL, so the two
      # have to be written together or a consumer is told to look somewhere the bytes are not.
      - name: Resolve release tag
        id: tag
        run: |
          set -eu
          tag="${{ inputs.release-tag }}"
          if [ -z "$tag" ]; then
            tag="engine-${{ inputs.engine }}-${{ inputs.version }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "## release tag: $tag"

      # The manifest is generated from the bytes on disk, never from the build log, and it fails the
      # run when a promised file is missing or empty: publishing a manifest that describes a file
      # nobody can download would turn into a confusing engine bug on someone else's machine.
      - name: Generate manifest
        id: manifest
        run: |
          set -eu
          files=""
          for name in ${{ inputs.artifact-files }}; do
            files="$files --file $name"
          done
          node .github/scripts/make-manifest.mjs \
            --engine "${{ inputs.engine }}" \
            --version "${{ inputs.version }}" \
            --upstream "${{ inputs.upstream-repository }} @ ${{ inputs.upstream-commit }}" \
            --emsdk "$EMSDK_VERSION" \
            --repository "${{ github.server_url }}/${{ github.repository }}" \
            --release-tag "${{ steps.tag.outputs.tag }}" \
            --dir "${{ inputs.artifact-dir }}" \
            $files \
            --out manifest.json
          echo "json<<EOF" >> "$GITHUB_OUTPUT"
          cat manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      # An Actions artifact for in-run and same-repo consumers (downloaded with the run's token),
      # and a Release asset for everyone else. Both carry the same bytes; the manifest is uploaded
      # beside them so a consumer can verify what it fetched.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: |
            ${{ inputs.artifact-dir }}/*
            manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag='${{ steps.tag.outputs.tag }}'
          # `gh release create` fails when the tag exists, which is the normal case for a rebuild of
          # the same version -- so treat "already exists" as success and clobber the assets below.
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" \
              --title "wasm: ${{ inputs.engine }} ${{ inputs.version }}" \
              --notes "Built from ${{ inputs.upstream-repository }} @ ${{ inputs.upstream-commit }} with Emscripten $EMSDK_VERSION on run [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})." \
              --target "${{ github.sha }}"
          uploaded=0
          for name in ${{ inputs.artifact-files }}; do
            gh release upload "$tag" "${{ inputs.artifact-dir }}/$name" --clobber
            uploaded=$((uploaded + 1))
          done
          gh release upload "$tag" manifest.json --clobber
          echo "## published $uploaded file(s) + manifest.json to $tag"
